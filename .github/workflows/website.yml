name: Publish LumaMusic website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "CNAME"
      - "assets/lumamusic-soundstage.svg"
      - "assets/lumamusic-logo.svg"
      - "assets/Screenshot_20261114-111431.png"
      - "assets/Screenshot_20261114-111449.png"
      - "assets/Screenshot_20261114-111553.png"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website artifact
        run: |
          mkdir -p site/assets
          cp -R website/. site/
          cp CNAME site/CNAME
          cp assets/lumamusic-soundstage.svg site/assets/lumamusic-soundstage.svg
          cp assets/lumamusic-logo.svg site/assets/lumamusic-logo.svg
          cp assets/lumamusic-icon.png site/assets/lumamusic-icon.png
          cp assets/Screenshot_20261114-111431.png site/assets/app-player.png
          cp assets/Screenshot_20261114-111449.png site/assets/app-library.png
          cp assets/Screenshot_20261114-111553.png site/assets/app-discovery.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
