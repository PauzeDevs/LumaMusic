name: Android Runtime Stress Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'providers/**'
      - 'services/**'
      - 'store/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/android-stress.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumamusic-android-stress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-stress:
    name: Emulator launch, navigation and memory soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure emulator ABI
        run: printf '\nreactNativeArchitectures=x86_64\n' >> android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/stress-app-debug.apk"

      - name: Boot emulator and run stress test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          script: bash .github/scripts/android-stress.sh

      - name: Upload stress-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-android-stress-results
          path: stress-results/
          if-no-files-found: warn
          retention-days: 14
