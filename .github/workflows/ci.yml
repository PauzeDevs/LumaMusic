name: LumaMusic standalone Android build and checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-release-apk:
    name: Standalone Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Expo config
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK with embedded JavaScript
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  js-bundles:
    name: Android and iOS JavaScript bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Export Android bundle
        run: npx expo export --platform android
      - name: Export iOS bundle
        run: npx expo export --platform ios
