name: LumaMusic Branch Checks

on:
  push:
    branches:
      - Fix/Vision2.0LunaMusic
      - fix/LunaMusic
      - feature/customizableui
      - main
  pull_request:
    branches:
      - main
      - fix/LunaMusic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumamusic-vision-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code checks (no APK / no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java for native Android validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android native modules (no APK)
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon
