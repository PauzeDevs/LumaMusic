name: LumaMusic Code Checks

on:
  push:
    branches:
      - Fix/Vision2.0LunaMusic
      - fix/LunaMusic
      - feature/customizableui
      - main
      - master
  pull_request:
    branches:
      - main
      - fix/LunaMusic
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumamusic-code-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    name: JavaScript and Expo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

  android-native-compile:
    name: Android native compilation (no APK packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android Kotlin sources
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run Android native unit tests
        working-directory: android
        run: ./gradlew :pauze-luma-audio-engine:testDebugUnitTest --no-daemon
