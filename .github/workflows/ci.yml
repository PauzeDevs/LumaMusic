name: LumaMusic CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for each PR or branch.
concurrency:
  group: lumamusic-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript and Expo validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

  js-bundles:
    name: Export ${{ matrix.platform }} JavaScript bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export JavaScript bundle
        run: npx expo export --platform ${{ matrix.platform }}

  android-release-apk:
    name: Standalone Android release APK
    runs-on: ubuntu-latest
    needs: [checks, js-bundles]
    # Native APK builds are expensive. Run them for manual builds and version tags,
    # not on every pull request or ordinary commit.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v4

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK with embedded JavaScript
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
