name: LumaMusic Code Checks

on:
  push:
    branches:
      - Fix/Vision2.0LunaMusic
      - fix/LunaMusic
      - feature/customizableui
      - main
  pull_request:
    branches:
      - main
      - fix/LunaMusic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumamusic-code-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: JavaScript and Expo checks (no native builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public
