name: Build and Release LumaMusic Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumamusic-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # APKs are generated only from main, including manual workflow dispatches.
    if: github.ref == 'refs/heads/main'
    name: Build release APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            label: 64-bit ARM
            asset: LumaMusic-arm64-v8a.apk
          - abi: armeabi-v7a
            label: 32-bit ARM
            asset: LumaMusic-armeabi-v7a.apk
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure target architecture
        run: printf '\nreactNativeArchitectures=%s\n' "${{ matrix.abi }}" >> android/gradle.properties

      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ matrix.asset }}"

      - name: Upload architecture APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-${{ matrix.abi }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

