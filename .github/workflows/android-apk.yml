name: Build and Release LumaMusic Android APKs

on:
  # A push to main builds both Android ABIs and publishes a GitHub nightly release.
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lumamusic-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            label: 64-bit ARM
            asset: LumaMusic-arm64-v8a.apk
          - abi: armeabi-v7a
            label: 32-bit ARM
            asset: LumaMusic-armeabi-v7a.apk
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure target architecture
        run: printf '\nreactNativeArchitectures=%s\n' "${{ matrix.abi }}" >> android/gradle.properties

      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ matrix.asset }}"

      - name: Upload architecture APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-${{ matrix.abi }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Luna Music Nightly - Stable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both architecture APKs
        uses: actions/download-artifact@v4
        with:
          pattern: lumamusic-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luna-music-nightly-stable-${{ github.run_number }}
          name: Luna Music Nightly - Stable
          prerelease: true
          files: |
            dist/LumaMusic-arm64-v8a.apk
            dist/LumaMusic-armeabi-v7a.apk
          body: |
            # LumaMusic | Release Notes

            **Update: Liquid Glass UI & Stability Improvements**

            This release brings a refreshed LumaMusic experience with a refined visual system, improved Android compatibility, and a more complete artist catalogue.

            ### 🐛 Bugs Fixed
            - **Android Liquid Glass compatibility:** Fixed the app attempting to load an iOS-only native Liquid Glass component on Android. Android now uses a safe fallback instead.
            - **Theme consistency in Account:** Fixed the Account screen using hard-coded dark styling instead of respecting the selected appearance and accent colour.
            - **Theme consistency in Playlists:** Fixed the Playlist screen not properly following the user's selected appearance and accent.
            - **Theme consistency in Liked Songs:** Updated the screen to respect the active theme.
            - **Artwork fallback:** Improved handling of missing or failed album artwork, displaying a themed fallback instead of leaving broken artwork.

            ### ✨ Improvements
            - **Visual refresh:** Introduced a deeper matte interface, refined typography, velvet-red accents, and updated surfaces.
            - **Liquid Glass controls:** Improved shared glass surfaces and made them respect Liquid Glass, Frosted, Clear, and Dark Matte preferences.
            - **Navigation redesign:** Refined the floating tab bar and mini-player.
            - **Track rows and cards:** Improved spacing, styling, and visual consistency.
            - **Audio Lab:** Refined the header and added LumaMusic branding.
            - **Artist pages:** Expanded artist track and release retrieval, with a higher pagination limit.
            - **Discography:** Added improved horizontal release shelves for albums, EPs, and singles.
            - **All tracks:** Replaced the limited “Popular tracks” section with an expanded “All tracks” catalogue.

            ### ⚙️ Compatibility
            - Improved Android handling of the iOS-only native Liquid Glass component.
            - Preserved platform-specific rendering behaviour.

            ### Important
            This release includes code-level compatibility and UI fixes. Native rendering, touch behaviour, and device-specific performance still require real-device verification. This update does not claim to fix every known playback or equalizer issue.

            ---
            **Developed by PauzeX Developments**  
            [Website](https://lumamusic.devs.surf) · [Support the project](https://pauze.is-a.dev/support/) · [GitHub](https://github.com/PauzeDevs/LumaMusic)

            *Thank you for using LumaMusic. Keep listening.*
