name: Build and Release LumaMusic Android APKs

on:
  # A push to main builds both Android ABIs and publishes a GitHub nightly release.
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lumamusic-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            label: 64-bit ARM
            asset: LumaMusic-arm64-v8a.apk
          - abi: armeabi-v7a
            label: 32-bit ARM
            asset: LumaMusic-armeabi-v7a.apk
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure target architecture
        run: printf '\nreactNativeArchitectures=%s\n' "${{ matrix.abi }}" >> android/gradle.properties

      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ matrix.asset }}"

      - name: Upload architecture APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-${{ matrix.abi }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Luna Music Nightly - Stable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both architecture APKs
        uses: actions/download-artifact@v4
        with:
          pattern: lumamusic-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luna-music-nightly-stable
          name: Luna Music Nightly - Stable
          prerelease: false
          overwrite_files: true
          files: |
            dist/LumaMusic-arm64-v8a.apk
            dist/LumaMusic-armeabi-v7a.apk
          body: |
            # LumaMusic | Release Notes

            **Update: Memory Optimisation, Playback Safety & Import Stability**

            This stable Android build includes the latest merged runtime optimisations and crash-prevention fixes. The existing visual design and UI layout are unchanged.

            ### ⚡ Memory Optimisation
            - Bounded YouTube stream and PO token caches to reduce retained memory.
            - Added bounded LRU caching for lyrics while preserving cache expiry behaviour.
            - Reduced React Query garbage-collection retention to two minutes.
            - Reduced artwork decode overhead with resize-first image handling.
            - Limited the reverb impulse-response cache to the active preset and clear it when reverb is disabled.

            ### 🛡️ Stability & Crash Prevention
            - Added a 512 KB input limit and field/row bounds for playlist CSV imports.
            - Hardened playlist import preview and matching error handling.
            - Replaced recursive YouTube Music payload traversal with bounded iterative traversal.
            - Added response-size limits and safer JSON response handling for YouTube Music requests.
            - Added guards against stale asynchronous audio startup callbacks during rapid track changes.

            ### 🎵 Playback & Catalogue Reliability
            - Improved stream URL refresh support for recovery from premature stream endings.
            - Added safer handling around playback source changes and foreground audio recovery.
            - Kept existing playback controls and app behaviour intact; no UI layout or styling changes were made.

            ### 📱 Android Builds
            - `LumaMusic-arm64-v8a.apk`: 64-bit ARM devices.
            - `LumaMusic-armeabi-v7a.apk`: 32-bit ARM devices.

            ### Verification
            - Both Android release APK build jobs completed successfully in GitHub Actions.
            - The release publishing job completed successfully.
            - Automated emulator stress testing remains unverified because the emulator environment failed before app stress checks could run. Real-device playback and memory behaviour should still be tested.

            ---
            **Developed by PauzeX Developments**  
            [Website](https://lumamusic.devs.surf) · [GitHub](https://github.com/PauzeDevs/LumaMusic)

            *Thank you for using LumaMusic. Keep listening.*
