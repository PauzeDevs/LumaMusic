name: LumaMusic Android Test APK

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build ARM64 APK
        working-directory: android
        run: |
          sed -i '/^reactNativeArchitectures=/d' gradle.properties
          printf '\nreactNativeArchitectures=arm64-v8a\n' >> gradle.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/LumaMusic-arm64-v8a.apk

      - name: Build ARMv7 APK
        working-directory: android
        run: |
          sed -i '/^reactNativeArchitectures=/d' gradle.properties
          printf '\nreactNativeArchitectures=armeabi-v7a\n' >> gradle.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../dist/LumaMusic-armeabi-v7a.apk

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: LumaMusic-Test-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
