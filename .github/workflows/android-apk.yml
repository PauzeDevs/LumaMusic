name: Build and Release LumaMusic Android APKs

on:
  # APK builds are never triggered by pushes to master.
  # Publishing remains an explicit workflow_dispatch action.
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-apk.yml
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Test APK (artifact only) or publish a stable GitHub release"
        required: true
        type: choice
        default: test
        options:
          - test
          - stable
      release_name:
        description: "Optional GitHub release title (stable only)"
        required: false
        type: string
        default: ""
      release_description:
        description: "Optional GitHub release notes/description (stable only)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: lumamusic-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            label: 64-bit ARM
            asset: LumaMusic-arm64-v8a.apk
          - abi: armeabi-v7a
            label: 32-bit ARM
            asset: LumaMusic-armeabi-v7a.apk
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure target architecture
        run: printf '\nreactNativeArchitectures=%s\n' "${{ matrix.abi }}" >> android/gradle.properties

      - name: Build optimized release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${{ matrix.asset }}"

      - name: Upload architecture APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamusic-${{ github.event.inputs.release_channel || 'stable' }}-${{ matrix.abi }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish LumaMusic stable release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_channel == 'stable'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both architecture APKs
        uses: actions/download-artifact@v4
        with:
          pattern: lumamusic-*
          path: dist
          merge-multiple: true

      - name: Prepare release description
        env:
          RELEASE_DESCRIPTION: ${{ github.event.inputs.release_description }}
        run: |
          if [ -n "$RELEASE_DESCRIPTION" ]; then
            printf '%s\\n' "$RELEASE_DESCRIPTION" > release-notes.md
          else
            cat > release-notes.md <<'RELEASE_NOTES'
  # 🌅 LumaMusic DayLight Update
RELEASE_NOTES
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daylight-${{ github.run_number }}
          name: ${{ github.event.inputs.release_name || format('LumaMusic DayLight Update #{0}', github.run_number) }}
          prerelease: false
          overwrite_files: true
          files: |
            dist/LumaMusic-arm64-v8a.apk
            dist/LumaMusic-armeabi-v7a.apk
          body_path: release-notes.md

            Yo guys! 👋

            We've been cooking behind the scenes, fixing things, polishing the experience, and making LumaMusic better with every update. Here's the DayLight Update.

            ### ✨ What's New
            - Refreshed the Preferences area with a cleaner matte-black appearance.
            - Improved the startup experience.
            - Continued improvements to YouTube-based audio streaming compatibility.
            - General internal stability and code-quality improvements.

            ### 🛠️ Bug Fixes
            - Removed the problematic blur integration associated with startup issues.
            - Removed the BlurTargetView integration.
            - Addressed issues from the previous blur implementation.
            - General stability fixes and cleanup.

            ### 📱 Which APK should you download?
            - **LumaMusic-arm64-v8a.apk (64-bit ARM):** Recommended for most modern Android phones and tablets with 64-bit ARM processors.
            - **LumaMusic-armeabi-v7a.apk (32-bit ARM):** For older Android devices that use a 32-bit ARM processor.

            If you're unsure, check your device's CPU architecture with a device-information app. Android version alone does not determine the correct APK.

