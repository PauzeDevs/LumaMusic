<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">LumaMusic, after hours</title><desc id="d">An editorial music-player cover with a cassette deck, spinning reels and an animated amber waveform.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10110F"/><stop offset=".56" stop-color="#1B1D18"/><stop offset="1" stop-color="#090B09"/></linearGradient>
 <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#FFE0A1"/><stop offset=".5" stop-color="#FF9B45"/><stop offset="1" stop-color="#D95A27"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#F48B3B" stop-opacity=".2"/><stop offset="1" stop-color="#F48B3B" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#FFF" opacity=".12"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
 @keyframes reel{to{transform:rotate(360deg)}}
 @keyframes bars{0%,100%{transform:scaleY(.22);opacity:.55}50%{transform:scaleY(1);opacity:1}}
 @keyframes scan{0%{transform:translateX(-250px);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateX(720px);opacity:0}}
 .reel{transform-origin:center;animation:reel 9s linear infinite}
 .eq{transform-box:fill-box;transform-origin:center;animation:bars 1.1s ease-in-out infinite}
 .e1{animation-delay:-.1s}.e2{animation-delay:-.6s}.e3{animation-delay:-.35s}.e4{animation-delay:-.85s}.e5{animation-delay:-.25s}.e6{animation-delay:-.7s}
 .scan{animation:scan 6s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.reel,.eq,.scan{animation:none}}
</style>
<rect width="1200" height="500" rx="22" fill="url(#bg)"/>
<rect width="1200" height="500" rx="22" fill="url(#grain)" opacity=".38"/>
<circle cx="890" cy="250" r="280" fill="url(#halo)" filter="url(#blur)"/>
<path d="M48 62H1152" stroke="#E6D8C3" stroke-opacity=".18"/>
<text x="60" y="48" fill="#B8B5A9" font-family="Arial,sans-serif" font-size="11" letter-spacing="4">PAUZEDEVS PRESENTS / AN INDEPENDENT LISTENING SPACE</text>
<text x="60" y="185" fill="#F4F0E6" font-family="Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="-7">LUMA</text>
<text x="60" y="274" fill="#F4F0E6" font-family="Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="-7">MUSIC<span fill="#FF9B45">.</span></text>
<text x="66" y="316" fill="#A6A396" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">FIND YOUR FREQUENCY.</text>
<g transform="translate(66 382)">
