   <rect class="eq e3" x="309" y="3" width="4" height="10" rx="2"/><rect class="eq e4" x="319" y="2" width="4" height="12" rx="2"/><rect class="eq e1" x="329" y="5" width="4" height="6" rx="2"/><rect class="eq e2" x="339" y="1" width="4" height="14" rx="2"/><rect class="eq e5" x="349" y="3" width="4" height="10" rx="2"/><rect class="eq e6" x="359" y="2" width="4" height="12" rx="2"/>
